services:
  agentic-db-engine:
    build: .
    container_name: agentic-db-engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内 localhost 指容器自身，需指向宿主机 MySQL
      DB_URI: mysql+pymysql://root:root@host.docker.internal:3306/ai_note
      # 容器内无预置 HF 权重，允许联网拉取（走 hf-mirror），缓存在命名卷中
      HF_HUB_OFFLINE: "0"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 挂载宿主机目录，确保产物和日志持久化
      - ./logs:/app/logs
      - ./Agentic_Audit_Artifacts:/app/Agentic_Audit_Artifacts
      # 向量经验库持久化
      - ./bge_db:/app/bge_db
      # HuggingFace 模型缓存，避免每次重建都重新下载 bge 模型
      - hf_cache:/root/.cache/huggingface
    restart: always

volumes:
  hf_cache: {}
